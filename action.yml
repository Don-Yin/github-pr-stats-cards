name: GitHub PR Stats Cards
description: Render responsive SVG cards for merged public contributions.
inputs:
  user:
    description: GitHub username whose merged pull requests are counted.
    required: true
  token:
    description: GitHub API token; the workflow token can read public contributions.
    required: false
    default: ${{ github.token }}
  limit:
    description: Repositories on the main card; the rest go to the -more card. 0 puts every repository on the main card.
    required: false
    default: "16"
outputs:
  wide:
    description: Path to the two-column SVG.
  narrow:
    description: Path to the one-column SVG.
  wide-more:
    description: Path to the two-column SVG of the repositories past the limit.
  narrow-more:
    description: Path to the one-column SVG of the repositories past the limit.
runs:
  using: node24
  main: index.mjs
branding:
  icon: git-pull-request
  color: green
