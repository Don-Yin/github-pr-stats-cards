name: GitHub PR Stats Cards
description: Render responsive SVG cards for merged public contributions.
inputs:
  user:
    description: GitHub username whose merged pull requests are counted.
    required: true
  token:
    description: GitHub API token; the workflow token can read public contributions.
    required: false
    default: ${{ github.token }}
  limit:
    description: Show only the top N repositories; 0 shows every repository.
    required: false
    default: "0"
  readme:
    description: >-
      README to rewrite between <!-- pr-stats:start --> and
      <!-- pr-stats:end --> with one link per repository;
      empty keeps the single card.
    required: false
    default: ""
  dir:
    description: Folder for the SVG files.
    required: false
    default: "."
outputs:
  wide:
    description: Path to the wide SVG.
  narrow:
    description: Path to the narrow SVG.
runs:
  using: node24
  main: index.mjs
branding:
  icon: git-pull-request
  color: green
